services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school
    ports:
      - "55432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school"]
      interval: 3s
      retries: 20

  php:
    build: ./backend/docker
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: school
      DB_USERNAME: school
      DB_PASSWORD: school
    depends_on:
      db:
        condition: service_healthy
    command: php -S 0.0.0.0:8000 -t public
    ports:
      - "8000:8000"

volumes:
  dbdata:
