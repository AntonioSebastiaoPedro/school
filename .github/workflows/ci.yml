name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
          POSTGRES_DB: school_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U school" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: school_test
      DB_USERNAME: school
      DB_PASSWORD: school
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, bcmath
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/pest

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: As migrations geradas estão em dia com o schema.sql
        run: |
          python3 saas_educativo_angola_artifacts/tools/build_migrations.py
          git diff --exit-code backend/database/migrations
      - name: OpenAPI válido
        run: npx --yes @redocly/cli@latest lint saas_educativo_angola_artifacts/api/openapi.yaml --max-problems 1000 --format=stylish | tee /tmp/lint.txt; ! grep -q " error " /tmp/lint.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
