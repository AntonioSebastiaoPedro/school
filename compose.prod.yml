services:
  app:
    restart: unless-stopped
    volumes: [storage:/var/www/html/storage]
    healthcheck: { test: ["CMD-SHELL", "php-fpm -t || exit 1"] }
  nginx:
    restart: unless-stopped
    build: { context: ., dockerfile: docker/php/Dockerfile, target: web }
    ports: ["127.0.0.1:${HTTP_PORT}:80"] # só o proxy TLS do anfitrião chega aqui
  postgres:
    restart: unless-stopped
